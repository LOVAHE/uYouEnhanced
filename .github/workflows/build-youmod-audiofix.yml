name: Build YouMod audio fix

on:
  push:
    paths:
      - .github/workflows/build-youmod-audiofix.yml
      - Tweaks/youmod_audiofix.py

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install make ldid

      - name: Setup Theos
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout --quiet
          mv *.sdk ../theos/sdks
          cd ..
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Headers
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"

      - name: Clone YouMod 2.0.0
        run: git clone --quiet --depth=1 --branch v2.0.0 https://github.com/Tonwalter888/YouMod.git YouMod

      - name: Apply audio fix
        run: python3 Tweaks/youmod_audiofix.py

      - name: Build
        run: |
          cd YouMod
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p ../out
          cp packages/*.deb ../out/youmod-audiofix.deb
          dpkg-deb -f ../out/youmod-audiofix.deb Package Version Architecture Depends > ../out/manifest.txt
          shasum -a 256 ../out/youmod-audiofix.deb >> ../out/manifest.txt
          git diff -- Files/Player.x Files/Shorts.x Files/Settings.x > ../out/audiofix.patch

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: youmod-2.0.0-audiofix
          path: out/
          retention-days: 7
          compression-level: 0
