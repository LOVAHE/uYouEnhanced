name: Build YouMod components

on:
  push:
    paths:
      - .github/workflows/build-youmod-components.yml

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Install dependencies
        run: brew install make ldid meson ninja go

      - name: Setup Theos
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout --quiet
          mv *.sdk ../theos/sdks
          cd ..
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Clone headers
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          cp -r "$THEOS/include/YouTubeHeader" "$THEOS/include/YTHeaders"
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"

      - name: Clone sources
        run: |
          git clone --quiet --depth=1 --branch v2.0.0 https://github.com/Tonwalter888/YouMod.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git
          git clone --quiet --depth=1 --recurse-submodules https://github.com/PoomSmart/YTUHD.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/UncappedAVPlayer.git
          git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouSlider.git
          git clone --quiet --depth=1 https://github.com/fosterbarnes/YTweaks.git
          git clone --quiet --depth=1 https://github.com/castdrian/Gonerino.git
          git clone --quiet --depth=1 https://github.com/jkhsjdhjs/youtube-native-share.git
          git clone --quiet --depth=1 https://github.com/VasirakCalgux/VolumeBoostYT.git

      - name: Record source revisions
        run: |
          mkdir -p out
          for d in YouMod YouPiP YTUHD Return-YouTube-Dislikes YouGroupSettings YTVideoOverlay YTABConfig UncappedAVPlayer DontEatMyContent YouSlider YTweaks Gonerino youtube-native-share VolumeBoostYT; do
            printf "%s %s\n" "$d" "$(git -C "$d" rev-parse HEAD)" >> out/source-revisions.txt
          done

      - name: Build YouMod
        run: |
          cd YouMod
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/youmod.deb

      - name: Build YouPiP
        run: |
          cd YouPiP
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/youpip.deb

      - name: Build YTUHD
        run: |
          cd YTUHD
          make libvpx dav1d
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless SIDELOAD=1
          cp packages/*.deb ../out/ytuhd.deb

      - name: Build Return YouTube Dislike
        run: |
          cd Return-YouTube-Dislikes
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/ryd.deb

      - name: Build YouGroupSettings
        run: |
          cd YouGroupSettings
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/ygs.deb

      - name: Build YTVideoOverlay
        run: |
          cd YTVideoOverlay
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/ytvo.deb

      - name: Build YTABConfig
        run: |
          cd YTABConfig
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/ytabconfig.deb

      - name: Build UncappedAVPlayer
        run: |
          cd UncappedAVPlayer
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          cp packages/*.deb ../out/uncappedavplayer.deb

      - name: Build DontEatMyContent
        run: |
          cd DontEatMyContent
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/demc.deb

      - name: Build YouSlider
        run: |
          wget --quiet https://github.com/Tonwalter888/Tonwalter888.github.io/raw/refs/heads/main/deb/alderis.deb -O out/alderis.deb
          cd YouSlider
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/youslider.deb

      - name: Build YTweaks
        run: |
          cd YTweaks
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/ytweaks.deb

      - name: Build Gonerino
        run: |
          cd Gonerino
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/gonerino.deb

      - name: Build native share
        run: |
          cd youtube-native-share
          git clone --quiet --depth=1 https://github.com/protocolbuffers/protobuf.git
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          cp packages/*.deb ../out/ytnativeshare.deb

      - name: Build VolumeBoostYT
        run: |
          cd VolumeBoostYT
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          cp packages/*.deb ../out/volboostyt.deb

      - name: Add packaging tools
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git
          cd OpenYouTubeSafariExtension
          git sparse-checkout set --no-cone OpenYouTubeSafariExtension.appex
          git checkout --quiet
          cp -R OpenYouTubeSafariExtension.appex ../out/
          cd ..
          curl -L --fail --silent --show-error https://github.com/asdfzxcvbn/pyzule-rw/archive/refs/heads/main.zip -o out/pyzule-rw-main.zip

      - name: Create manifest
        run: |
          for f in out/*.deb; do
            echo "== $(basename "$f") ==" >> out/manifest.txt
            dpkg-deb -f "$f" Package Version Architecture Depends >> out/manifest.txt || true
            shasum -a 256 "$f" >> out/manifest.txt
            echo >> out/manifest.txt
          done
          shasum -a 256 out/pyzule-rw-main.zip >> out/manifest.txt

      - name: Upload components
        uses: actions/upload-artifact@v4
        with:
          name: youmod-2.0.0-components
          path: out/
          retention-days: 7
          if-no-files-found: error
