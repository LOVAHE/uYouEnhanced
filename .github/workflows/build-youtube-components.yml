name: Build YouTube components

on:
  push:
    branches: [build/youtube-21.47.6]
    paths:
      - .github/workflows/build-youtube-components.yml
      - Tweaks/youmod_audiofix.py
      - Tweaks/ytuhd_native_safe.py

permissions:
  contents: read

concurrency:
  group: build-youtube-components-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tweaks:
    name: YouMod and companion tweaks
    if: github.actor == github.repository_owner
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      YOUMOD_COMMIT: 8f9670966d62f20590b867db4377e0331b1e824b
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install dependencies
        run: |
          brew install make ldid dpkg go
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up Theos
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout --quiet
          mv *.sdk ../theos/sdks
          cd ..
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Clone headers
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          cp -r "$THEOS/include/YouTubeHeader" "$THEOS/include/YTHeaders"
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"

      - name: Clone sources
        run: |
          git clone --quiet --filter=blob:none https://github.com/Tonwalter888/YouMod.git
          git -C YouMod checkout --quiet --detach "$YOUMOD_COMMIT"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/UncappedAVPlayer.git
          git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouSlider.git
          git clone --quiet --depth=1 https://github.com/fosterbarnes/YTweaks.git
          git clone --quiet --depth=1 https://github.com/castdrian/Gonerino.git
          git clone --quiet --depth=1 https://github.com/jkhsjdhjs/youtube-native-share.git
          git clone --quiet --depth=1 https://github.com/VasirakCalgux/VolumeBoostYT.git

      - name: Record source revisions
        run: |
          mkdir -p out
          for d in YouMod YouPiP Return-YouTube-Dislikes YouGroupSettings YTVideoOverlay YTABConfig UncappedAVPlayer DontEatMyContent YouSlider YTweaks Gonerino youtube-native-share VolumeBoostYT; do
            printf "%s %s\n" "$d" "$(git -C "$d" rev-parse HEAD)" >> out/source-revisions.txt
          done
          cat out/source-revisions.txt

      - name: Apply YouMod audio fix
        run: |
          python3 Tweaks/youmod_audiofix.py
          git -C YouMod diff --ignore-cr-at-eol -- Files/Player.x Files/Shorts.x Files/Settings.x > out/youmod-audiofix.patch

      - name: Build YouMod
        run: |
          cd YouMod
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/youmod.deb

      - name: Build YouPiP
        run: |
          cd YouPiP
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/youpip.deb

      - name: Build Return YouTube Dislike
        run: |
          cd Return-YouTube-Dislikes
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/ryd.deb

      - name: Build YouGroupSettings
        run: |
          cd YouGroupSettings
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/ygs.deb

      - name: Build YTVideoOverlay
        run: |
          cd YTVideoOverlay
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/ytvo.deb

      - name: Build YTABConfig
        run: |
          cd YTABConfig
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/ytabconfig.deb

      - name: Build UncappedAVPlayer
        run: |
          cd UncappedAVPlayer
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          cp packages/*.deb ../out/uncappedavplayer.deb

      - name: Build DontEatMyContent
        run: |
          cd DontEatMyContent
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/demc.deb

      - name: Build YouSlider
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Tonwalter888/Tonwalter888.github.io/raw/refs/heads/main/debs/alderis.deb \
            --output out/alderis.deb
          cd YouSlider
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/youslider.deb

      - name: Build YTweaks
        run: |
          cd YTweaks
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/ytweaks.deb

      - name: Build Gonerino
        run: |
          cd Gonerino
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb ../out/gonerino.deb

      - name: Build native share
        run: |
          cd youtube-native-share
          git clone --quiet --depth=1 https://github.com/protocolbuffers/protobuf.git
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          cp packages/*.deb ../out/ytnativeshare.deb

      - name: Build VolumeBoostYT
        run: |
          cd VolumeBoostYT
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          cp packages/*.deb ../out/volboostyt.deb

      - name: Create manifest
        run: |
          for f in out/*.deb; do
            echo "== $(basename "$f") ==" >> out/manifest.txt
            dpkg-deb -f "$f" Package Version Architecture Depends >> out/manifest.txt || true
            shasum -a 256 "$f" >> out/manifest.txt
            echo >> out/manifest.txt
          done
          cat out/manifest.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: youmod-components
          path: out/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

  ytuhd:
    name: YTUHD Native SABR
    if: github.actor == github.repository_owner
    runs-on: macos-15
    timeout-minutes: 20
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_COMMIT: 16362d3aa83a0acd56df4493d575d34306d42478
      LOGOS_COMMIT: a62370066a97e36d59b200a9fa10c5091f5e8972
      SDK_COMMIT: f573274868bf0f954ed01a1ab029756218a91119
      YOUTUBE_HEADER_COMMIT: 7a87be7855e2ea8f820f634518388eec9b667ec4
      PS_HEADER_COMMIT: 1bb7d9c7d1bc40a57f83e1e58aa53bcf4acdcbfa
      YTUHD_COMMIT: cf266c2a351eb4f97e6bb2fb129509c501bdf207
      OVERLAY_COMMIT: 0f7dbc4387a0e38aad3180744e484fef6cbb9094
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build dependencies
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Pinned toolchain and sources
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout -q --detach "$THEOS_COMMIT"
          git -C "$THEOS" submodule update --init --recursive
          git -C "$THEOS/vendor/logos" fetch -q --depth=1 origin "$LOGOS_COMMIT"
          git -C "$THEOS/vendor/logos" checkout -q --detach "$LOGOS_COMMIT"
          git clone -q --no-checkout --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set iPhoneOS18.6.sdk
          git -C "$RUNNER_TEMP/sdks" checkout -q "$SDK_COMMIT"
          mv "$RUNNER_TEMP/sdks/iPhoneOS18.6.sdk" "$THEOS/sdks/"
          git clone -q --filter=blob:none https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          git -C "$THEOS/include/YouTubeHeader" checkout -q --detach "$YOUTUBE_HEADER_COMMIT"
          git clone -q --filter=blob:none https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          git -C "$THEOS/include/PSHeader" checkout -q --detach "$PS_HEADER_COMMIT"
          git clone -q --filter=blob:none https://github.com/Tonwalter888/YTUHD.git YTUHD
          git -C YTUHD checkout -q --detach "$YTUHD_COMMIT"
          git clone -q --filter=blob:none https://github.com/PoomSmart/YTVideoOverlay.git YTVideoOverlay
          git -C YTVideoOverlay checkout -q --detach "$OVERLAY_COMMIT"
      - name: Apply patch and run policy tests
        run: |
          set -euo pipefail
          mkdir -p out
          python3 Tweaks/ytuhd_native_safe.py YTUHD | tee out/policy-tests.txt
      - name: Compile YTUHD
        run: |
          make -C YTUHD clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp YTUHD/packages/*.deb out/ytuhd-native-sabr.deb
      - name: Validate component
        run: |
          set -euo pipefail
          dpkg-deb -f out/ytuhd-native-sabr.deb > out/control.txt
          dpkg-deb -x out/ytuhd-native-sabr.deb "$RUNNER_TEMP/component"
          binary=$(find "$RUNNER_TEMP/component" -name YTUHD.dylib -print -quit)
          test -n "$binary"
          otool -L "$binary" > out/dependencies.txt
          nm -u "$binary" > out/imports.txt
          if grep -Eq 'MSHookFunction|libundirect|mprotect|vm_protect' out/imports.txt; then
            echo 'Unsafe native function patch import' >&2; exit 1
          fi
          strings "$binary" > "$RUNNER_TEMP/strings.txt"
          if grep -Eq 'iosPlayerClientSharedConfigDisableServerDrivenAbr|_postponePreferredFormatFiltering|SupportsCodec|acquirePlayerForVideo:|streamSelectorHasSelectableVideoFormats:' "$RUNNER_TEMP/strings.txt"; then
            echo 'Legacy playback override found in component' >&2; exit 1
          fi
          grep -F '1.13.4+nativevp9.2-sabr' "$RUNNER_TEMP/strings.txt"
          shasum -a 256 out/ytuhd-native-sabr.deb > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ytuhd-native-sabr
          path: out/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

  package:
    name: Package YouTube
    needs: [tweaks, ytuhd]
    if: github.actor == github.repository_owner
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: input-youtube-21.47.6
      INPUT_SHA256: d14b0f744b85553be38f3549103f2cd51831417cc386a87fd203fefad7825605
      PYZULE_COMMIT: 740d3716dcd98c20c000f12cdb88f1f0b2a533a4
      APP_NAME: YouTube
      BUNDLE_ID: com.google.ios.youtube
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: components

      - name: Install packaging tools
        run: |
          brew install ldid dpkg
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --silent --show-error \
            "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" \
            --output "$RUNNER_TEMP/bin/tbd"
          chmod +x "$RUNNER_TEMP/bin/tbd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          pipx install \
            "https://github.com/asdfzxcvbn/pyzule-rw/archive/${PYZULE_COMMIT}.zip"

      - name: Download YouTube
        id: youtube
        run: |
          set -euo pipefail
          asset_id=$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$INPUT_TAG\") | .assets[0].id"
          )
          test -n "$asset_id"
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            > "$RUNNER_TEMP/youtube.ipa"
          echo "$INPUT_SHA256  $RUNNER_TEMP/youtube.ipa" | shasum -a 256 -c -
          unzip -tq "$RUNNER_TEMP/youtube.ipa"
          unzip -p "$RUNNER_TEMP/youtube.ipa" "Payload/YouTube.app/Info.plist" \
            > "$RUNNER_TEMP/Info.plist"
          version=$(
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" \
              "$RUNNER_TEMP/Info.plist"
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Inject tweaks
        id: inject
        env:
          YOUTUBE_VERSION: ${{ steps.youtube.outputs.version }}
        run: |
          set -euo pipefail
          youmod_version=$(dpkg-deb -f components/youmod-components/youmod.deb Version)
          full="YouTube_${YOUTUBE_VERSION}_YouMod-${youmod_version}_Full-NativeSABR.ipa"
          base="YouTube_${YOUTUBE_VERSION}_YouMod-${youmod_version}_Full-NoYTUHD.ipa"
          cyan -i "$RUNNER_TEMP/youtube.ipa" -o "$full" -uwef \
            components/youmod-components/*.deb \
            components/ytuhd-native-sabr/ytuhd-native-sabr.deb \
            -n "$APP_NAME" -b "$BUNDLE_ID"
          cyan -i "$RUNNER_TEMP/youtube.ipa" -o "$base" -uwef \
            components/youmod-components/*.deb \
            -n "$APP_NAME" -b "$BUNDLE_ID"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "youmod_version=$youmod_version" >> "$GITHUB_OUTPUT"

      - name: Validate packages
        env:
          FULL: ${{ steps.inject.outputs.full }}
          BASE: ${{ steps.inject.outputs.base }}
        run: |
          set -euo pipefail
          for package in "$FULL" "$BASE"; do
            unzip -tq "$package"
            entries=$(unzip -Z1 "$package")
            echo "== $package"
            grep -E '^Payload/YouTube\.app/Frameworks/[^/]+\.dylib$' <<< "$entries"
            for required in \
              "Payload/YouTube.app/Frameworks/YouMod.dylib" \
              "Payload/YouTube.app/Frameworks/YTVideoOverlay.dylib" \
              "Payload/YouTube.app/YouMod.bundle/Info.plist"; do
              if ! grep -Fxq "$required" <<< "$entries"; then
                echo "Missing required package entry: $required" >&2
                exit 1
              fi
            done
            if grep -Eq '\.appex/|^Payload/YouTube\.app/(PlugIns|Extensions|Watch)/' <<< "$entries"; then
              echo "App extensions remained in $package" >&2
              exit 1
            fi
            unzip -p "$package" "Payload/YouTube.app/YouTube" > "$RUNNER_TEMP/final-YouTube"
            otool -L "$RUNNER_TEMP/final-YouTube" > "$RUNNER_TEMP/final-load.txt"
            grep -F "YouMod.dylib" "$RUNNER_TEMP/final-load.txt"
            unzip -p "$package" "Payload/YouTube.app/Info.plist" > "$RUNNER_TEMP/final-Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/final-Info.plist")" = "$BUNDLE_ID"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$RUNNER_TEMP/final-Info.plist")" = "$APP_NAME"
          done
          unzip -Z1 "$FULL" | grep -Fxq "Payload/YouTube.app/Frameworks/YTUHD.dylib"
          if unzip -Z1 "$BASE" | grep -Fq "/YTUHD.dylib"; then
            echo "YTUHD remained in the package built without it" >&2
            exit 1
          fi
          shasum -a 256 "$FULL" "$BASE" | tee SHA256SUMS.txt

      - name: Create draft release
        env:
          FULL: ${{ steps.inject.outputs.full }}
          BASE: ${{ steps.inject.outputs.base }}
          YOUTUBE_VERSION: ${{ steps.youtube.outputs.version }}
          YOUMOD_VERSION: ${{ steps.inject.outputs.youmod_version }}
        run: |
          set -euo pipefail
          {
            echo '```'
            cat components/youmod-components/source-revisions.txt
            echo '```'
          } > notes.md
          gh release create "youtube-${YOUTUBE_VERSION}-youmod-${YOUMOD_VERSION}-${GITHUB_RUN_NUMBER}" \
            --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "YouTube ${YOUTUBE_VERSION} + YouMod ${YOUMOD_VERSION} (${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md \
            "$FULL" "$BASE" SHA256SUMS.txt
